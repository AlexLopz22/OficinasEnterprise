<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oficinas Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E8E2D0;
    --paper-card: #F3EFE3;
    --ink: #24291F;
    --ink-soft: #55584C;
    --line: #C9C0A4;
    --stamp: #A33227;
    --brass: #B08A3E;
    --focus: #1E5AA8;
    --maps: #1F7A4D;
    --waze: #2B6FD1;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.35), transparent 60%),
      var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  ::selection{ background: var(--stamp); color: var(--paper-card); }

  header{
    max-width: 900px;
    margin: 0 auto;
    padding: 56px 24px 28px;
  }

  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--stamp);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 16px;
  }
  .eyebrow::before{ content:""; width: 22px; height: 1px; background: var(--stamp); }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.1rem, 4.5vw, 3.2rem);
    line-height: 1;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  header p.lead{
    max-width: 520px;
    color: var(--ink-soft);
    font-size: 1rem;
    line-height: 1.55;
    margin: 0;
  }

  .controls{
    max-width: 900px;
    margin: 0 auto 8px;
    padding: 0 24px;
  }

  .drawer{
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px 20px;
    display:flex;
    align-items:center;
    gap: 12px;
  }

  .drawer label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  #buscador{
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    color: var(--ink);
    padding: 4px 2px;
    outline: none;
  }
  #buscador::placeholder{ color: #9a927a; font-family: 'Inter', sans-serif; font-size: 0.95rem; }

  #contador{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  #buscador:focus-visible, .card:focus-visible, .btn:focus-visible{
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  main{
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 24px 100px;
  }

  #grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }
  @media (max-width: 640px){ #grid{ grid-template-columns: 1fr; } }

  .card{
    position: relative;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 20px 20px 18px;
    display:flex;
    flex-direction: column;
    gap: 12px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover{ transform: translateY(-2px); box-shadow: 0 8px 20px rgba(36,41,31,0.12); }

  .card::before{
    content:"";
    position:absolute;
    top: 14px; left: 14px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.25);
  }

  .indice{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--brass);
    letter-spacing: 0.06em;
    padding-left: 20px;
  }

  .card h3{
    font-family: 'Fraunces', serif;
    font-size: 1.2rem;
    font-weight: 600;
    margin: 0;
    line-height: 1.2;
  }

  .card .direccion{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 0;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }

  .botones{
    display:flex;
    gap: 8px;
    margin-top: 4px;
  }

  .btn{
    flex: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    padding: 9px 10px;
    border-radius: 3px;
    border: 1.5px solid transparent;
    transition: filter 0.15s ease;
  }
  .btn:hover{ filter: brightness(1.08); }
  .btn svg{ width: 15px; height: 15px; flex-shrink: 0; }

  .btn-maps{ background: var(--maps); color: #fff; }
  .btn-waze{ background: var(--waze); color: #fff; }

  #vacio{
    display:none;
    text-align:center;
    padding: 50px 20px;
    color: var(--ink-soft);
    font-family: 'Fraunces', serif;
    font-size: 1.2rem;
  }
  #vacio span{
    display:block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--stamp);
    margin-bottom: 8px;
  }

  footer{
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 50px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){ .card{ transition:none; } }
</style>
</head>
<body>

  <div class="eyebrow">Bloc de ubicaciones</div>
  <h1>Oficinas Enterprise</h1>
  <p class="lead">Busca por nombre o ciudad y pulsa Maps o Waze para abrir la ruta directamente.</p>
</header>

<div class="controls">
  <div class="drawer">
    <label for="buscador">Buscar</label>
    <input type="text" id="buscador" placeholder="nombre, código..." autocomplete="off">
    <span id="contador"></span>
  </div>
</div>

<main>
  <div id="grid"></div>
  <div id="vacio">
    <span>Sin resultados</span>
    Ninguna oficina coincide con esa búsqueda.
  </div>
</main>

<footer><a href="https://portfolio-alejandro-lopez.vercel.app/" style="color: var(--ink-soft);">© Alejandro López Olmedo</a> </footer>

<script>
(function(){
  const rawJSON = document.getElementById('datos-oficinas').textContent;
  const oficinas = JSON.parse(rawJSON);

  const grid = document.getElementById('grid');
  const buscador = document.getElementById('buscador');
  const contador = document.getElementById('contador');
  const vacio = document.getElementById('vacio');

  // Construye la URL de Google Maps a partir de la dirección de texto
  function urlMaps(direccion){
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(direccion)}`;
  }

  // Construye la URL de Waze a partir de la dirección de texto
  function urlWaze(direccion){
    return `https://waze.com/ul?q=${encodeURIComponent(direccion)}&navigate=yes`;
  }

  function crearTarjeta(oficina){
    const card = document.createElement('article');
    card.className = 'card';
    card.tabIndex = 0;

    card.innerHTML = `
      <span class="indice">Nº ${String(oficina.id).padStart(3,'0')}</span>
      <h3>${oficina.nombre}</h3>
      <p class="direccion">${oficina.direccion}</p>
      <div class="botones">
        <a class="btn btn-maps" href="${urlMaps(oficina.direccion)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          Maps
        </a>
        <a class="btn btn-waze" href="${urlWaze(oficina.direccion)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 1 9 9"/><path d="M3 12h.01M21 12a9 9 0 0 0-9-9"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/></svg>
          Waze
        </a>
      </div>
    `;
    return card;
  }

  function filtrar(){
    const q = buscador.value.trim().toLowerCase();
    if (!q) return oficinas;
    return oficinas.filter(o =>
      (o.nombre + ' ' + o.direccion).toLowerCase().includes(q)
    );
  }

  function render(){
    const resultados = filtrar();
    grid.innerHTML = '';
    resultados.forEach(o => grid.appendChild(crearTarjeta(o)));

    contador.textContent = `${resultados.length} / ${oficinas.length}`;
    vacio.style.display = resultados.length === 0 ? 'block' : 'none';
    grid.style.display = resultados.length === 0 ? 'none' : 'grid';
  }

  buscador.addEventListener('input', render);
  render();
})();
</script>
