<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficinas Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    html {
      min-height: 100%;
    }
    :root {
      --paper: #E5EBDD;
      --paper-card: #F4F6ED;
      --ink: #1D3025;
      --ink-soft: #637467;
      --line: #C1D0BD;
      --stamp: #39734D;
      --brass: #8A9D5B;
      --focus: #397A50;
      --maps: #286B43;
      --waze: #668C52;

      --green-dark: #193D2A;
      --green-medium: #477A53;
      --green-light: #D5E3D1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at top left, rgba(255, 255, 255, 0.65), transparent 60%),
        linear-gradient(145deg, #EAF0E5, var(--paper));
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--green-medium);
      color: #fff;
    }

    header {
      max-width: 900px;
      margin: 0 auto;
      padding: 56px 24px 28px;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--stamp);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--stamp);
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(2.1rem, 4.5vw, 3.2rem);
      line-height: 1;
      margin: 0 0 12px;
      letter-spacing: -0.01em;
      color: var(--green-dark);
    }

    header p.lead {
      max-width: 520px;
      color: var(--ink-soft);
      font-size: 1rem;
      line-height: 1.65;
      margin: 0;
    }

    .controls {
      max-width: 900px;
      margin: 0 auto 8px;
      padding: 0 24px;
    }

    .drawer {
      background: rgba(244, 246, 237, 0.9);
      border: 1px solid var(--line);
      border-left: 4px solid var(--green-medium);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 14px rgba(29, 48, 37, 0.04);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .drawer:focus-within {
      border-color: var(--green-medium);
      box-shadow: 0 0 0 3px rgba(71, 122, 83, 0.12);
    }

    .drawer label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--green-medium);
      white-space: nowrap;
    }

    #buscador {
      flex: 1;
      border: none;
      background: transparent;
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      color: var(--ink);
      padding: 4px 2px;
      outline: none;
    }

    #buscador::placeholder {
      color: #93A492;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
    }

    #contador {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--green-medium);
      white-space: nowrap;
    }

    #buscador:focus-visible,
    .card:focus-visible,
    .btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 24px 100px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    @media (max-width: 640px) {
      #grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      position: relative;
      background: var(--paper-card);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 22px 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      overflow: hidden;
    }

    .card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--green-medium), var(--brass));
      opacity: 0.8;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #9DB99C;
      box-shadow: 0 10px 24px rgba(29, 48, 37, 0.10);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 17px;
      right: 17px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green-light);
      border: 2px solid var(--green-medium);
    }

    .indice {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--green-medium);
      letter-spacing: 0.08em;
      padding-left: 0;
    }

    .card h3 {
      font-family: 'Fraunces', serif;
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
      line-height: 1.25;
      color: var(--green-dark);
    }

    .card .direccion {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--ink-soft);
      margin: 0;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
    }

    .botones {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.82rem;
      padding: 10px;
      border-radius: 6px;
      border: 1.5px solid transparent;
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(29, 48, 37, 0.12);
    }

    .btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .btn-maps {
      background: var(--maps);
      color: #fff;
    }

    .btn-waze {
      background: var(--waze);
      color: #fff;
    }

    #vacio {
      display: none;
      text-align: center;
      padding: 50px 20px;
      color: var(--ink-soft);
      font-family: 'Fraunces', serif;
      font-size: 1.2rem;
    }

    #vacio span {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--green-medium);
      margin-bottom: 8px;
    }

    footer {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 50px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-soft);
      text-align: center;
    }

    @media (max-width: 480px) {
      header {
        padding-top: 40px;
      }

      .drawer {
        padding: 14px;
        gap: 8px;
      }

      .drawer label {
        font-size: 10px;
      }

      .card {
        padding: 20px 17px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .card,
      .btn,
      .drawer {
        transition: none;
      }
    }
  </style>
</head>

<body>

    <div class="eyebrow">Bloc de ubicaciones</div>
    <h1>Oficinas Enterprise</h1>
    <p class="lead">Busca por nombre o ciudad y pulsa Maps o Waze para abrir la ruta directamente.</p>
  </header>

  <div class="controls">
    <div class="drawer">

  </div>

    <div id="grid"></div>
    <div id="vacio">

      Ninguna oficina coincide con esa búsqueda.
    </div>
  </main>

  <footer><a href="https://portfolio-alejandro-lopez.vercel.app/" style="color: var(--ink-soft);">© Alejandro López

  <script>
    (function () {
      const rawJSON = document.getElementById('datos-oficinas').textContent;
      const oficinas = JSON.parse(rawJSON);

      const grid = document.getElementById('grid');
      const buscador = document.getElementById('buscador');
      const contador = document.getElementById('contador');
      const vacio = document.getElementById('vacio');

      // Construye la URL de Google Maps a partir de la dirección de texto
      function urlMaps(direccion) {
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(direccion)}`;
      }

      // Construye la URL de Waze a partir de la dirección de texto
      function urlWaze(direccion) {
        return `https://waze.com/ul?q=${encodeURIComponent(direccion)}&navigate=yes`;
      }

      function crearTarjeta(oficina) {
        const card = document.createElement('article');
        card.className = 'card';
        card.tabIndex = 0;

        card.innerHTML = `
      <span class="indice">Nº ${String(oficina.id).padStart(3, '0')}</span>
      <h3>${oficina.nombre}</h3>
      <p class="direccion">${oficina.direccion}</p>
      <div class="botones">
        <a class="btn btn-maps" href="${urlMaps(oficina.coordenadas)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          Maps
        </a>
        <a class="btn btn-waze" href="${urlWaze(oficina.coordenadas)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 1 9 9"/><path d="M3 12h.01M21 12a9 9 0 0 0-9-9"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/></svg>
          Waze
        </a>
      </div>
    `;
        return card;
      }

      function filtrar() {
        const q = buscador.value.trim().toLowerCase();
        if (!q) return oficinas;
        return oficinas.filter(o =>
          (o.nombre + ' ' + o.direccion).toLowerCase().includes(q)
        );
      }

      function render() {
        const resultados = filtrar();
        grid.innerHTML = '';
        resultados.forEach(o => grid.appendChild(crearTarjeta(o)));

        contador.textContent = `${resultados.length} / ${oficinas.length}`;
        vacio.style.display = resultados.length === 0 ? 'block' : 'none';
        grid.style.display = resultados.length === 0 ? 'none' : 'grid';
      }

      buscador.addEventListener('input', render);
      render();
    })();
  </script>
